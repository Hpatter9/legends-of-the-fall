<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calamity · The Ashen Road · Map proposal</title>
<style>
@font-face{font-family:Cinzel;src:url('/out/web/fonts/cinzel-decorative-latin-700-normal.woff2')}@font-face{font-family:Alegreya;src:url('/out/web/fonts/alegreya-sans-latin-400-normal.woff2')}@font-face{font-family:Alegreya;src:url('/out/web/fonts/alegreya-sans-latin-700-normal.woff2');font-weight:700}*{box-sizing:border-box}body{margin:0;background:#07110e;color:#eadfc4;font:15px/1.25 Alegreya,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #ffe2a3;outline-offset:3px}.screen{height:100svh;max-width:440px;margin:auto;display:flex;flex-direction:column;position:relative;background:#0a1812;box-shadow:0 0 40px #0009}.head{position:relative;z-index:5;padding:14px 17px 9px;background:linear-gradient(130deg,#1c3027,#0b1a14);border-bottom:1px solid #a78b50;box-shadow:0 3px 15px #0008}.head:before,.head:after{position:absolute;content:'◆';bottom:-7px;color:#c9a45b;font-size:12px}.head:before{left:9px}.head:after{right:9px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#bca978;margin:0 0 3px}h1{font:700 22px/1.2 Cinzel,serif;color:#ffe0a0;margin:0;text-shadow:0 2px 3px #000}.tools{display:flex;gap:6px}.tools button{background:#12251c;color:#e9d2a2;border:1px solid #8f7951;padding:7px 9px;min-height:38px;border-radius:2px}.bar{display:flex;align-items:center;gap:7px;font-size:12px;color:#b6bea8;margin-top:10px}.bar strong{font-weight:400;color:#eed798}.pill{padding:3px 7px;border:1px solid #7d70474d;background:#0a150d77;white-space:nowrap}.gold{margin-left:auto;color:#f7d37f}.region{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#b1a17a;text-align:center;margin:8px 0 0}.viewport{flex:1;min-height:0;position:relative;overflow:auto;scrollbar-width:none;touch-action:pan-y}.world{height:100%;min-height:580px;position:relative;isolation:isolate;background:#2b3625 url('/src/art/calmap-overland/valley.png') center /100% 100% no-repeat}.world:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#07100c22,#09150f00 35%,#07120a22 80%,#07150ed9),radial-gradient(ellipse at 50% 75%,transparent 30%,#06100b44)}.world:after{content:'';position:absolute;inset:0;border-left:2px solid #a68a4344;border-right:2px solid #a68a4344;pointer-events:none}.routes{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.routeShadow{fill:none;stroke:#0b1b0cc9;stroke-width:10;stroke-linecap:round}.route{fill:none;stroke:#b49e6977;stroke-width:3;stroke-dasharray:5 9;stroke-linecap:round}.route.open{stroke:#edd490;stroke-width:4;stroke-dasharray:5 7;filter:drop-shadow(0 0 3px #efb653)}.route.chosen{stroke:#ffdf85;stroke-width:5;stroke-dasharray:0;filter:drop-shadow(0 0 5px #ffbe5b)}.node{position:absolute;width:62px;height:65px;transform:translate(-50%,-76%);border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;isolation:isolate;overflow:visible}.node svg{width:62px;height:62px;position:relative;z-index:1;filter:drop-shadow(0 4px 3px #000b);flex-shrink:0;transition:filter .2s,transform .2s}.node:before{content:'';position:absolute;width:46px;height:15px;border:1px solid #c8a85f77;border-radius:50%;bottom:4px;background:#0d1b0f66;box-shadow:0 2px 5px #0007}.node.locked svg{filter:saturate(.45) brightness(.65) drop-shadow(0 3px 3px #000a)}.node.chosen svg{transform:translateY(-3px);filter:drop-shadow(0 0 8px #ffda8277) drop-shadow(0 3px 3px #000)}.node.chosen:before,.node.open:before{border-color:#ffe8a5;box-shadow:0 0 0 3px #b4902944,0 0 15px #ffcc6588;background:#c69d2344}.node b{position:absolute;top:61px;font-size:10px;font-weight:400;white-space:nowrap;padding:2px 6px;background:#0c1a11db;border:1px solid #b69b5755;border-radius:2px;color:#e7d6af;text-shadow:0 1px #000;z-index:2}.node.locked b{color:#c5c3b2}.node.chosen b{border-color:#e7c36b;color:#ffe9ab}.node.boss{width:82px;height:82px}.node.boss svg{width:82px;height:82px}.node.boss b{top:78px;color:#ffc7a8;border-color:#a56f4f}.node.done:after{content:'✓';position:absolute;right:0;top:5px;z-index:3;border:1px solid #dfc17e;background:#173421;color:#e9d394;border-radius:50%;width:17px;height:17px;font-size:12px}.party{position:absolute;left:44%;top:94%;transform:translate(-50%,-50%);width:24px;height:28px;background:linear-gradient(135deg,#f7da8d,#ac7c34);clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%);color:#19281b;text-align:center;font:bold 19px/25px Georgia;filter:drop-shadow(0 0 5px #ffdd79);transition:left .8s ease-in-out,top .8s ease-in-out;z-index:4}.you{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);text-align:center;color:#f6e1ad;font-size:10px;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 4px #000;white-space:nowrap}.legend{position:absolute;top:10px;left:12px;color:#e0c79a;background:#0a180ed9;border:1px solid #9f84554d;padding:5px 8px;font-size:10px;letter-spacing:1px}.destination{padding:11px 16px 12px;background:linear-gradient(120deg,#1c3025,#0c1b14);border-top:1px solid #b18b4c;box-shadow:0 -6px 18px #0008;z-index:6}.destination .eyebrow{font-size:9px;letter-spacing:1.5px;color:#c2ae78}.selection{display:flex;align-items:center;gap:10px}.selection svg{width:49px;height:49px;flex-shrink:0;filter:drop-shadow(0 0 5px #d6b75c44)}.selection h2{font:700 16px Cinzel;color:#ffe1a0;margin:0 0 4px}.selection p{font-size:12px;line-height:1.25;color:#bfc6b0;margin:0}.travel{margin-top:9px;width:100%;min-height:44px;border:1px solid #d2b26a;box-shadow:inset 0 0 0 2px #203424,inset 0 0 0 3px #e5c27455;background:linear-gradient(#4f653b,#263d28);font:700 15px Cinzel;color:#fff0b4;text-shadow:0 2px 2px #000;border-radius:2px}.travel:disabled{filter:saturate(.2);opacity:.6}.help{margin:6px 0 0;font-size:10px;text-align:center;color:#adad91}.help strong{color:#e9cc8d;font-weight:400}.notice{position:absolute;z-index:8;top:135px;left:16px;right:16px;text-align:center;padding:10px;background:#11271df5;border:1px solid #c6a563;color:#f1dba4;box-shadow:0 3px 15px #0009}.notice[hidden]{display:none}@media(max-height:800px){.head{padding-top:10px}.world{min-height:530px}.destination{padding-top:9px}h1{font-size:20px}.bar{margin-top:7px}.region{margin-top:5px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<main class="screen"><header class="head"><div class="top"><div><p class="eyebrow">The Calamity · Region I / III</p><h1>The Ashen Road</h1></div><div class="tools"><button id="pack">Pack</button><button id="home">Home</button></div></div><div class="bar"><span class="pill"><strong>Knight</strong> · Lv 1</span><span class="pill">1 hero</span><span class="pill">Altar dormant</span><span class="gold">◆ 40</span></div><p class="region">I · The Ashen Road ── II ── III</p></header><section class="viewport" aria-label="Exploration map"><div class="world"><svg class="routes" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg><div class="party" aria-label="Your company">⚑</div><div class="legend">FOLLOW THE GOLDEN ROAD</div><div class="you">Your journey begins</div></div></section><footer class="destination"><p class="eyebrow">Next encounter · Battle</p><div class="selection"></div><button class="travel">Travel to the outpost</button><p class="help">Choose a route. <strong>Your hero leads the way.</strong></p></footer><div class="notice" hidden role="status"></div></main>
<script>
const graph=[{"id":0,"row":0,"lane":2,"kind":"fight","next":[2,3]},{"id":1,"row":0,"lane":4,"kind":"fight","next":[4],"twist":"narrow"},{"id":2,"row":1,"lane":1,"kind":"fight","next":[5],"twist":"gale"},{"id":3,"row":1,"lane":2,"kind":"fight","next":[5]},{"id":4,"row":1,"lane":3,"kind":"fight","next":[5]},{"id":5,"row":2,"lane":1,"kind":"recruit","next":[6,7,8]},{"id":6,"row":3,"lane":0,"kind":"treasure","next":[9]},{"id":7,"row":3,"lane":2,"kind":"elite","next":[9],"twist":"mana"},{"id":8,"row":3,"lane":3,"kind":"shop","next":[9]},{"id":9,"row":4,"lane":4,"kind":"campfire","next":[10]},{"id":10,"row":5,"lane":2,"kind":"boss","next":[]}];
const positions=[[44,81],[78,80],[24,66],[49,67],[73,65],[47,55],[24,43],[51,43],[78,44],[58,31],[69,17]];
const names={fight:'Roadside ambush',elite:'Elite stronghold',recruit:'Recruit lodge',shop:'Travelling merchant',campfire:'Roadside refuge',treasure:'Forgotten treasure',boss:'The Ashen Guardian'};
const short={fight:'Battle',elite:'Elite',recruit:'Recruit',shop:'Merchant',campfire:'Rest',treasure:'Treasure',boss:'Guardian'};
const descriptions={fight:'Defeat the outpost. Earn gold and experience.',elite:'A dangerous warband guarding powerful relics.',recruit:'Choose one of three allies to join your company.',shop:'Spend your gold on heroes, equipment and supplies.',campfire:'Rest, train, or reforge your altar.',treasure:'Search the ruins for gold and equipment.',boss:'Defeat the guardian to enter the next region.'};
const cells={fight:0,elite:1,recruit:2,campfire:3,shop:4,treasure:5,altar:6,mystery:7,boss:8};
const atlas='/src/art/calmap-overland/landmarks.png';
const sprite=kind=>`<svg viewBox="${cells[kind]%3*418} ${[0,418,804][Math.floor(cells[kind]/3)]} 418 ${[418,386,450][Math.floor(cells[kind]/3)]}" aria-hidden="true"><image href="${atlas}" width="1254" height="1254"/></svg>`;
let selected=0,current=-1;const done=new Set();
const world=document.querySelector('.world'),routes=document.querySelector('.routes'),selection=document.querySelector('.selection'),travel=document.querySelector('.travel');
const edges=graph.flatMap(n=>n.next.map(to=>[n.id,to]));edges.push([-1,0],[-1,1]);
const point=id=>id<0?[44,94]:positions[id];
function available(id){return done.has(id)||edges.some(([a,b])=>(a===id&&done.has(b))||(b===id&&(a<0||done.has(a))));}
function draw(){world.querySelectorAll('.node').forEach(e=>e.remove());routes.innerHTML='';for(const[a,b]of edges){const from=point(a),to=point(b),gold=(a<0||done.has(a)||done.has(b)),chosen=(b===selected&&(a<0||done.has(a)))||(a===selected&&done.has(b));const d=`M ${from[0]*10} ${from[1]*10} C ${from[0]*10} ${(from[1]+to[1])*5},${to[0]*10} ${(from[1]+to[1])*5},${to[0]*10} ${to[1]*10}`;routes.insertAdjacentHTML('beforeend',`<path class="routeShadow" d="${d}"/><path class="route ${gold?'open':''} ${chosen?'chosen':''}" d="${d}"/>`)}for(const n of graph){const b=document.createElement('button');b.className=`node ${n.kind==='boss'?'boss ':''}${available(n.id)?'open':'locked'} ${selected===n.id?'chosen':''} ${done.has(n.id)?'done':''}`;b.style.left=positions[n.id][0]+'%';b.style.top=positions[n.id][1]+'%';b.setAttribute('aria-label',names[n.kind]+(available(n.id)?' · available':' · unreached'));b.setAttribute('aria-pressed',String(selected===n.id));b.innerHTML=sprite(n.kind)+`<b>${short[n.kind]}</b>`;b.onclick=()=>{selected=n.id;draw()};world.append(b)}const n=graph[selected];selection.innerHTML=sprite(n.kind)+`<div><h2>${names[n.kind]}</h2><p>${descriptions[n.kind]}</p></div>`;document.querySelector('.destination .eyebrow').textContent=(done.has(selected)?'Visited encounter':available(selected)?'Next encounter':'Further along the road')+' · '+short[n.kind];travel.disabled=!available(selected);travel.textContent=done.has(selected)?'Return to this location':'Travel to '+short[n.kind].toLowerCase()}
travel.onclick=()=>{if(!available(selected))return;current=selected;done.add(current);const p=point(current);document.querySelector('.party').style.left=p[0]+'%';document.querySelector('.party').style.top=p[1]+'%';document.querySelector('.you').textContent='Your company travels onward';draw()};
function notice(text){const e=document.querySelector('.notice');e.textContent=text;e.hidden=false;setTimeout(()=>e.hidden=true,2200)}document.querySelector('#pack').onclick=()=>notice('Your company starts with an empty pack.');document.querySelector('#home').onclick=()=>notice('The road awaits your return.');draw();
</script></html>
