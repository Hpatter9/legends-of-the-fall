<main class="screen"><header class="head"><div class="top"><div><p class="eyebrow">The Calamity · Region I / III</p><h1 class="title">The Buried Sanctum</h1></div><button class="close" aria-label="Close map">×</button></div><div class="status"><span class="avatar"></span><span><b>Knight</b><br>Starter · Lv 1</span><span class="chip">1 hero</span><span class="chip">100% HP</span><span class="gold">◆ 40</span></div></header><section class="dungeonViewport" aria-label="Dungeon exploration floor"><div class="world"><svg class="grid" viewBox="0 0 360 560" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="floor" width="48" height="48" patternUnits="userSpaceOnUse"><image href="/src/art/stand/floor1.png" width="48" height="48"/></pattern></defs><g class="halls"></g></svg><div class="legend"><i></i><span class="explored">1 of 13 chambers explored</span></div><div class="player" aria-label="Your starter hero"></div><div class="floorCaption">An ancient power stirs below</div></div></section><footer class="controlPanel"><div class="selectedTitle"><span class="selectedIcon"></span><div><p class="eyebrow">Northern chamber · Unexplored</p><h2>Sentinel Chamber</h2><p class="description">A guarded passage. Gold and experience await.</p></div></div><div class="controls"><div class="dpad" aria-label="Move through connected rooms"><button data-dir="up" aria-label="Move north">↑</button><button data-dir="left" aria-label="Move west">←</button><button data-dir="down" aria-label="Move south">↓</button><button data-dir="right" aria-label="Move east">→</button></div><div class="actionWrap"><button class="enter">Enter chamber</button><p class="hint">Tap a chamber or use the arrows.<br>Cleared rooms stay open.</p></div></div><div class="chips"><button class="altarButton"><b>Altar</b> · dormant</button><button class="packButton">Pack · 0 items</button><button class="partyButton">Company · 1</button></div></footer><div class="banner" hidden role="status"></div></main>
<script>
const atlas='/src/art/calmap-dungeon/encounters.png';
const frames={"fight":{"x":0,"y":0,"width":418,"height":410},"elite":{"x":418,"y":0,"width":418,"height":410},"recruit":{"x":836,"y":0,"width":418,"height":410},"campfire":{"x":0,"y":410,"width":418,"height":370},"shop":{"x":418,"y":410,"width":418,"height":395},"treasure":{"x":836,"y":410,"width":418,"height":375},"altar":{"x":0,"y":780,"width":418,"height":474},"mystery":{"x":418,"y":805,"width":418,"height":449},"boss":{"x":836,"y":785,"width":418,"height":469}};
const sprite=kind=>{const f=frames[kind];return `<svg viewBox="${f.x} ${f.y} ${f.width} ${f.height}" aria-hidden="true"><image href="${atlas}" width="1254" height="1254"/></svg>`};
const hero=`<svg viewBox="0 0 184 113" aria-hidden="true"><image href="/src/art/units/hero_soldier.png" width="736" height="791"/></svg>`;
const rooms=[{id:'start',x:1,y:5,kind:'altar',name:'The Threshold'},{id:'battle',x:1,y:4,kind:'fight',name:'Sentinel Chamber'},{id:'east',x:2,y:5,kind:'fight',name:'East Guardroom'},{id:'treasure',x:0,y:4,kind:'treasure',name:'Sealed Treasury'},{id:'recruit',x:1,y:3,kind:'recruit',name:'Lost Company'},{id:'fight2',x:2,y:4,kind:'fight',name:'Rusted Barracks'},{id:'shop',x:2,y:3,kind:'shop',name:'The Undermerchant'},{id:'altar',x:0,y:3,kind:'altar',name:'Forgotten Altar'},{id:'elite',x:1,y:2,kind:'elite',name:'Oathbreaker Hall'},{id:'rest',x:2,y:2,kind:'campfire',name:'Ember Refuge'},{id:'mystery',x:0,y:2,kind:'mystery',name:'Whispering Archive'},{id:'fight3',x:0,y:1,kind:'fight',name:'Western Sentinel'},{id:'boss',x:1,y:0,kind:'boss',name:'The Buried Guardian'}];
const edges=[['start','battle'],['start','east'],['battle','treasure'],['battle','recruit'],['battle','fight2'],['east','fight2'],['recruit','shop'],['recruit','altar'],['recruit','elite'],['fight2','shop'],['shop','rest'],['altar','treasure'],['altar','mystery'],['elite','rest'],['mystery','fight3'],['elite','boss'],['fight3','boss']];
const short={fight:'Battle',elite:'Elite',recruit:'Recruit',campfire:'Rest',shop:'Merchant',treasure:'Treasure',altar:'Altar',mystery:'Mystery',boss:'Guardian'};
const descriptions={fight:'A guarded passage. Gold and experience await.',elite:'A powerful foe guards a choice of relics.',recruit:'A stranded ally may join your company.',campfire:'Rest, train, or reforge your altar.',shop:'Return here to trade with the undermerchant.',treasure:'Search the treasury for gold and equipment.',altar:'An ancient blessing waits to be awakened.',mystery:'An uncertain bargain beyond the doorway.',boss:'Finish exploring before facing the guardian.'};
const byId=id=>rooms.find(r=>r.id===id);const point=r=>({x:62+r.x*118,y:69+r.y*86});const near=id=>edges.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]);const visited=new Set(['start']);let current='start',selected='battle';
const world=document.querySelector('.world'),halls=document.querySelector('.halls'),enter=document.querySelector('.enter');
const reachable=id=>visited.has(id)||near(id).some(n=>visited.has(n));
function draw(){world.querySelectorAll('.room,.torch').forEach(e=>e.remove());halls.innerHTML='';for(const [aid,bid] of edges){const a=point(byId(aid)),b=point(byId(bid));const d=`M ${a.x} ${a.y} L ${a.x} ${b.y} L ${b.x} ${b.y}`;const lit=visited.has(aid)||visited.has(bid),selectedPath=(aid===selected&&visited.has(bid))||(bid===selected&&visited.has(aid));halls.insertAdjacentHTML('beforeend',`<path d="${d}" class="hallWall"/><path d="${d}" class="hallEdge"/><path d="${d}" class="hallFloor"/>${lit?'':`<path d="${d}" class="hallDim"/>`}${selectedPath?`<path d="${d}" class="hallSelected"/>`:''}`)}for(const r of rooms){const p=point(r),open=reachable(r.id),b=document.createElement('button');b.className=`room ${r.kind==='boss'?'boss':''} ${visited.has(r.id)?'cleared':''} ${r.id===current?'current':''} ${selected===r.id?'selected':''} ${open?'open':'unreached'}`;b.dataset.id=r.id;b.style.cssText=`--x:${p.x/360*100}%;--y:${p.y/560*100}%`;b.setAttribute('aria-label',r.name+' · '+(visited.has(r.id)?'cleared':open?'available':'unreached'));b.setAttribute('aria-pressed',String(selected===r.id));b.innerHTML=sprite(r.kind)+`<span class="label">${r.id===current?'You are here':short[r.kind]}</span>${visited.has(r.id)?'<span class="clear">✓</span>':''}`;b.onclick=()=>{selected=r.id;draw()};world.append(b)}for(const [x,y]of [[28,390],[211,405],[268,451],[211,272],[31,220],[147,74],[277,189]]){const t=document.createElement('div');t.className='torch';t.style.cssText=`--x:${x/360*100}%;--y:${y/560*100}%`;t.innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true"><image href="/src/art/tower/torch.png" width="288" height="48"/></svg>';world.append(t)}const pos=point(byId(current));document.querySelector('.player').style.cssText=`--x:${pos.x/360*100}%;--y:${pos.y/560*100}%`;document.querySelector('.player').innerHTML=hero;document.querySelector('.avatar').innerHTML=hero;document.querySelector('.explored').textContent=`${visited.size} of ${rooms.length} chambers explored`;const r=byId(selected);document.querySelector('.selectedIcon').innerHTML=sprite(r.kind);document.querySelector('.selectedTitle h2').textContent=r.name;document.querySelector('.description').textContent=descriptions[r.kind];document.querySelector('.selectedTitle .eyebrow').textContent=`${short[r.kind]} · ${visited.has(selected)?'Cleared':reachable(selected)?'Unexplored':'Unreached'}`;enter.disabled=!reachable(selected)||current===selected;enter.textContent=current===selected?'Current chamber':visited.has(selected)?'Return to chamber':'Enter chamber';for(const b of document.querySelectorAll('.dpad button')){b.disabled=!directionTarget(b.dataset.dir)}}
function directionTarget(dir){const r=byId(current),d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];return near(current).map(byId).filter(n=>(d[0]?Math.sign(n.x-r.x)===d[0]&&n.y===r.y:Math.sign(n.y-r.y)===d[1]&&n.x===r.x)).sort((a,b)=>Math.abs(a.x-r.x)+Math.abs(a.y-r.y)-Math.abs(b.x-r.x)-Math.abs(b.y-r.y))[0]}
function move(id){if(!reachable(id)||id===current)return;current=id;selected=id;visited.add(id);draw()}
enter.onclick=()=>move(selected);for(const b of document.querySelectorAll('.dpad button'))b.onclick=()=>{const r=directionTarget(b.dataset.dir);if(r)move(r.id)};document.addEventListener('keydown',e=>{if(e.key in {ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1}){e.preventDefault();const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key],r=directionTarget(dir);if(r)move(r.id)}});
function notice(text){const b=document.querySelector('.banner');b.textContent=text;b.hidden=false;setTimeout(()=>b.hidden=true,2200)}document.querySelector('.altarButton').onclick=()=>notice('Your altar awakens after the first victory.');document.querySelector('.packButton').onclick=()=>notice('Your pack is empty. Search the chambers for equipment.');document.querySelector('.partyButton').onclick=()=>notice('Knight · Level 1 · Your starting hero.');document.querySelector('.close').onclick=()=>notice('Your expedition can be resumed from this chamber.');draw();
</script></html>
