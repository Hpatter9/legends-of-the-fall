  .ldClouds.far { opacity: .22; animation-duration: 31s; animation-direction: alternate-reverse; }
  .ldSnow { position: absolute; inset: 0; overflow: hidden; mask-image: linear-gradient(transparent 15%, #000 24% 82%, transparent 91%); }
  .ldSnow i { position: absolute; left: var(--x); top: -12px; width: var(--size); height: var(--size); border-radius: 50%; background: #f7eedb; opacity: 0; animation: ldSnowFall var(--t) linear var(--d) infinite; }
  .ldSnow i:nth-child(3n) { filter: blur(.5px); }
  .ldMist { position: absolute; inset: 48% -20% 15%; background: radial-gradient(ellipse at 32% 44%, #efe1bf16, transparent 42%), radial-gradient(ellipse at 73% 63%, #efe1bf12, transparent 36%); animation: ldMist 19s ease-in-out infinite alternate; }
  .ldMist.far { inset: 42% -25% 30%; opacity: .5; animation-duration: 29s; animation-delay: -12s; }
  .ldShade { inset: 0; background: linear-gradient(#17161422, transparent 22% 78%, #171614e8 91%, #171614); }
  .ldEmbers { inset: 0; overflow: hidden; }
  .ldEmbers i { position: absolute; left: var(--x); bottom: 36%; width: 2px; height: 3px; background: #edbf67; opacity: 0; animation: ldEmber var(--t) linear var(--d) infinite; }
  .ldEmbers i:nth-child(3n) { width: 3px; height: 2px; }
  .ldTitle { top: max(5.5%, calc(env(safe-area-inset-top) + 12px)); left: 4%; right: 4%; margin: 0; color: #f3e5c5; font: 900 clamp(38px, 11.5vw, 68px)/1.1 Georgia, serif; letter-spacing: .025em; text-transform: uppercase; text-shadow: 0 2px 3px #171614; }
  .ldTitle small { display: block; margin: 8px auto 0; padding: 9px 0; width: fit-content; border-top: 1px solid #d2a95780; border-bottom: 1px solid #d2a95780; font: 700 clamp(11px, 3.6vw, 20px)/1.2 Georgia, serif; letter-spacing: .13em; }
  #loading .ldFooter { left: 8%; right: 8%; bottom: max(2.5%, calc(env(safe-area-inset-bottom) + 12px)); display: grid; gap: 10px; justify-items: center; }
  .ldLine { margin: 0; color: #f3e5c5; font: 400 clamp(18px, 5vw, 24px)/1.3 Georgia, serif; text-shadow: 0 2px 8px #171614; }
  .ldBar { position: relative; width: 100%; max-width: 340px; height: 7px; border: 1px solid #c79947; padding: 2px; background: #171614; overflow: hidden; }
  .ldBar i { display: block; width: 35%; height: 100%; background: linear-gradient(90deg, #a87832, #f0c66f, #c79947); animation: ldMarch 2.8s ease-in-out infinite alternate; }
  .ldBar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, #fff1bf88 50%, transparent 65%); transform: translateX(-100%); animation: ldBarSheen 3.8s ease-in-out infinite; }
  .ldTip { min-height: 2.6em; max-width: 330px; margin: 0; color: #c5b99f; font: 400 12px/1.3 Georgia, serif; text-shadow: 0 1px 4px #171614; }
  @keyframes ldDepth { from { transform: scale(1); } to { transform: scale(1.012) translate3d(-.15%, .15%, 0); } }
  @keyframes ldCrownBreathe { from { opacity: .35; } to { opacity: .85; } }
  @keyframes ldGleam { 0%, 18% { background-position: 100% 0; opacity: 0; } 25% { opacity: .65; } 65% { opacity: .65; } 80%, 100% { background-position: 0% 0; opacity: 0; } }
  @keyframes ldCloudDrift { from { transform: translate3d(-3%, 0, 0); } to { transform: translate3d(3%, 1.2%, 0); } }
  @keyframes ldSnowFall { 0% { transform: translate3d(0, -10px, 0); opacity: 0; } 12%, 80% { opacity: var(--alpha); } 100% { transform: translate3d(var(--dx), 105vh, 0); opacity: 0; } }
  @keyframes ldMist { from { transform: translate3d(-4%, 1%, 0); } to { transform: translate3d(5%, -2%, 0); } }
  @keyframes ldEmber { 0% { transform: translate3d(0, 0, 0) rotate(-15deg); opacity: 0; } 18%, 65% { opacity: .65; } 100% { transform: translate3d(var(--dx, 20px), -55vh, 0) rotate(30deg); opacity: 0; } }
  @keyframes ldMarch { from { transform: translateX(0); } to { transform: translateX(186%); } }
  @keyframes ldBarSheen { 60%, 100% { transform: translateX(100%); } }
