# Builds the Android app (Capacitor wrapping out/web) and attaches the APK to a GitHub Release.
# Runs once a day, and only when main has moved since the newest release; or by hand (Actions, Build the Android app,
# Run workflow), which always builds. Once a day keeps the account inside its free Actions minutes and storage.
# See docs/notes/android-app.md.
name: Build the Android app

on:
  schedule:
    # 10:47 UTC every day (03:47 Pacific in summer, 02:47 in winter): outside 06:00 to 09:00 Pacific, off the hour.
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Is there anything new to build? A run by hand always builds. A scheduled run builds only when main's commit is not
  # the newest release's, and package.json's version has not been released yet (a release is named after the version).
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Started by hand: building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No release yet: building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "main ($GITHUB_SHA) is the newest release's commit ($TAG): nothing to build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$GITHUB_SHA" --jq .content | base64 -d | jq -r .version)
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $VER is already released (v$VER): nothing to build until the version moves."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main moved since $TAG (to $VER): building."
          echo "changed=true" >> "$GITHUB_OUTPUT"

  apk:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # (the old default also asks for 'tools', a package the SDK no longer has)
          packages: 'platform-tools'
      - run: npm ci
      - run: npm run web
      - run: npx cap sync android

      - name: Read the version
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # versionCode: 0.320.0 -> 320000 (minor * 1000 + patch), so every release is higher than the last
          CODE=$(node -p "const [a,b,c]='$V'.split('.').map(Number); a*1000000+b*1000+c")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Use the release key, if the secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key set: the APK will be signed with the debug key."
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PappVersionName=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "legends-of-the-last-keep-${{ steps.ver.outputs.version }}.apk"

      # (no upload-artifact: the APK is on the release, and release files do not count against Actions storage)

      # The notes list the pull requests merged since the previous release: a merge commit's second line, or a squash
      # merge's title (its first line, ending "(#123)"); with none, the last commit's title.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          TITLES=""
          if [ -n "$PREV" ]; then
            TITLES=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_SHA" --jq '
              .commits | reverse | .[] | .commit.message | split("\n") | map(select(length > 0)) as $l
              | if ($l[0] | startswith("Merge pull request")) then ($l[1] // $l[0])
                elif ($l[0] | test("\\(#[0-9]+\\)$")) then $l[0]
                else empty end' || true)
          fi
          if [ -z "$TITLES" ]; then
            TITLES=$(git log -1 --format=%s "$GITHUB_SHA")
          fi
          {
            if [ -n "$PREV" ]; then echo "Merged since $PREV:"; else echo "In this build:"; fi
            echo
            printf '%s\n' "$TITLES" | sed 's/^/- /'
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: legends-of-the-last-keep-*.apk
          body_path: release-notes.md
