# Builds the Android app (Capacitor wrapping out/web) and attaches the APK to a GitHub Release.
# Runs when a tag like v0.320.0 is pushed, or by hand (Actions, Run workflow). See docs/notes/android-app.md.
name: Build the Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # (the old default also asks for 'tools', a package the SDK no longer has)
          packages: 'platform-tools'
      - run: npm ci
      - run: npm run web
      - run: npx cap sync android

      - name: Read the version
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # versionCode: 0.320.0 -> 320000 (minor * 1000 + patch), so every release is higher than the last
          CODE=$(node -p "const [a,b,c]='$V'.split('.').map(Number); a*1000000+b*1000+c")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Use the release key, if the secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key set: the APK will be signed with the debug key."
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PappVersionName=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "legends-of-the-last-keep-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: legends-of-the-last-keep-*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: legends-of-the-last-keep-*.apk
          generate_release_notes: true
