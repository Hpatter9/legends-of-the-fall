<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3a2218" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<title>Legends of the Fall</title>
<style>
  :root {
    --ink: #f6ead6;
    --dim: #c8b394;
    --wood: rgba(38, 22, 14, 0.86);
    --edge: #8c5a32;
    --gold: #f0b44a;
    --red: #d9573f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #cdc8e0;
    image-rendering: pixelated;
    color: var(--ink);
    font: 14px/1.25 'Trebuchet MS', Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  /* the backdrop: five parallax layers (sky, clouds, peak, far hills, near hills), shifted a little by the pan */
  #sky { position: fixed; inset: 0; overflow: hidden; }
  #sky div { position: absolute; left: -12%; right: -12%; top: 0; bottom: 0; background: center bottom / auto 100% repeat-x; will-change: transform; }
  #sky div:nth-child(1) { background-size: 100% 100%; }
  #sky div:nth-child(2) { background-image: url(bg2.png); }
  #sky div:nth-child(3) { background-image: url(bg3.png); }
  #sky div:nth-child(4) { background-image: url(bg4.png); }
  #sky div:nth-child(5) { background-image: url(bg5.png); }
  #sky div:nth-child(1) { background-image: url(bg1.png); }
  #sky::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(20, 10, 6, 0.1), rgba(20, 10, 6, 0.35)); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  button {
    font: inherit; font-weight: bold; color: var(--ink); background: #5a3520; border: 2px solid var(--edge);
    border-radius: 8px; padding: 10px 14px; cursor: pointer; text-shadow: 0 1px 0 #000;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(#c9762e, #8e4618); border-color: var(--gold); font-size: 17px; }
  button:disabled { opacity: 0.4; }

  #top {
    position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; background: linear-gradient(var(--wood), rgba(38, 22, 14, 0));
  }
  #top h1 { margin: 0; font-size: 16px; color: var(--gold); letter-spacing: 0.5px; white-space: nowrap; }
  #status { flex: 1; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { font-variant-numeric: tabular-nums; color: var(--ink); }
  #speed { padding: 4px 10px; display: none; }
  #mute, #gear { padding: 4px 8px; font-size: 14px; line-height: 1; }
  /* upright (a phone is narrow): the title, gold and buttons share the first row and the stage and status the second,
     which keeps clear of the version line at the top right; in a fight the title makes way for the clock */
  @media (orientation: portrait) {
    #top { flex-wrap: wrap; row-gap: 2px; }
    #top h1 { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    body[data-phase="fight"] #top h1 { display: none; }
    #gold { margin-right: auto; }
    #status { order: 1; flex: 1 1 100%; padding-right: 140px; font-size: 13px; }
  }
  body[data-phase='fight'] #speed { display: block; }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--wood); border-top: 2px solid var(--edge); display: flex; flex-direction: column; gap: 8px;
  }
  #bench { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 172px; overflow-y: auto; }
  .card {
    position: relative; background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; padding: 2px 2px 4px;
    text-align: center; touch-action: none;
  }
  .card canvas { width: 100%; max-width: 64px; aspect-ratio: 1; display: block; margin: 0 auto; image-rendering: pixelated; }
  .card em { position: absolute; top: 1px; left: 3px; font-style: normal; font-size: 10px; color: var(--gold); text-shadow: 0 1px 0 #000; }
  .card b { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card i { display: block; height: 4px; margin: 3px 4px 0; background: #2a1a10; border-radius: 2px; overflow: hidden; }
  .card i span { display: block; height: 100%; background: #5fd35f; }
  .card.g2 { border-color: #b8c8e0; box-shadow: 0 0 6px rgba(200, 220, 255, 0.45); background: linear-gradient(#2a3040, rgba(0, 0, 0, 0.35)); }
  .card.g3 { border-color: #f0c040; box-shadow: 0 0 9px rgba(255, 200, 70, 0.7), inset 0 0 8px rgba(255, 210, 90, 0.35); background: linear-gradient(#4a3810, rgba(0, 0, 0, 0.35)); }
  .card.g3 em { color: #ffe27a; }
  .card.evolve { animation: evolve 0.9s ease-out; }
  .card.evolve::before {
    content: ''; position: absolute; inset: -4px; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle, #fff 0%, rgba(255, 226, 122, 0.8) 35%, transparent 70%); animation: evolveFlash 0.9s ease-out forwards;
  }
  @keyframes evolve { 0% { transform: scale(0.8); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes evolveFlash { 0% { opacity: 1; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.7); } }
  .card.placed { border-color: #4a9cff; }
  .card.placed::after { content: '✓'; position: absolute; top: 2px; right: 5px; color: #7cc0ff; font-weight: bold; }
  .card.chosen { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .card.fallen { opacity: 0.4; filter: grayscale(1); }
  body:not([data-phase='deploy']) .card:not(.placed) { opacity: 0.3; }
  body:not([data-phase='deploy']) .card.placed::after { content: none; }
  #buttons { display: flex; gap: 8px; }
  #buttons #fight { flex: 1; }
  #gold { color: var(--gold); font-weight: bold; white-space: nowrap; }
  body:not([data-phase='deploy']) #buttons { display: none; }

  /* the king's spells: shown only during the fight */
  #spells { display: none; flex-direction: column; gap: 6px; }
  body[data-phase='fight'] #spells { display: flex; }
  #mana { display: flex; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  #mana i { flex: 1; height: 10px; background: #2a1a10; border: 1px solid #5a3a22; border-radius: 5px; overflow: hidden; }
  #mana i span { display: block; height: 100%; width: 0; background: linear-gradient(#7cc0ff, #3a78d6); }
  #spellCards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .spell {
    position: relative; overflow: hidden; padding: 5px 2px 4px; text-align: center; font-size: 12px; line-height: 1.2;
    background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; color: var(--ink);
  }
  .spell b { display: block; }
  .spell em { font-style: normal; color: #7cc0ff; }
  .spell .cool { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0, 0, 0, 0.55); pointer-events: none; }
  .spell.dim { opacity: 0.45; filter: grayscale(0.8); }
  .spell.armed { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); opacity: 1; filter: none; }
  #spellHint { min-height: 14px; font-size: 11px; color: var(--dim); text-align: center; }

  /* the trait strip, in the deploy phase only */
  #traits { display: flex; gap: 5px; overflow-x: auto; min-height: 24px; }
  #traitHint { min-height: 13px; font-size: 11px; color: var(--dim); text-align: center; }
  body:not([data-phase='deploy']) #traits, body:not([data-phase='deploy']) #traitHint { display: none; }
  .trait { flex: none; padding: 3px 8px; font-size: 12px; border-radius: 12px; border: 1px solid #5a3a22; background: rgba(0, 0, 0, 0.35); color: var(--dim); }
  .trait.class { border-style: dashed; }
  .trait.on { color: #1a1008; background: var(--gold); border-color: var(--gold); font-weight: bold; }
  .trait.picked { outline: 2px solid #7cc0ff; }
  .card .lv { display: block; font-size: 9px; line-height: 1; color: #cfc3b0; }
  .card small { display: flex; justify-content: center; gap: 2px; margin-top: 1px; }
  .card small span { font-size: 9px; line-height: 1; padding: 1px 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); color: #cfc3b0; }

  /* sideways: the bench down the right */
  @media (orientation: landscape) {
    #panel { left: auto; top: 0; width: 230px; border-top: 0; border-left: 2px solid var(--edge); padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 8px 8px; justify-content: center; }
    #bench { grid-template-columns: repeat(3, 1fr); max-height: 150px; }
    #buttons { flex-wrap: wrap; }
    #buttons button { flex: 1 1 40%; }
    #top { right: 230px; }
  }

  #result {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(12, 6, 4, 0.55); animation: fade 0.4s ease-out;
  }
  #result[hidden] { display: none; }
  #banner { font: bold 46px/1 Georgia, serif; letter-spacing: 2px; text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, 0.8); animation: punch 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  #banner.won { color: var(--gold); }
  #banner.lost { color: var(--red); }
  #summary { color: var(--dim); text-shadow: 0 1px 0 #000; }
  #stars { display: flex; flex-direction: column; gap: 6px; width: min(300px, 86vw); }
  #stars[hidden] { display: none; }
  #stars .star { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 0 8px; padding: 6px 10px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; color: var(--dim); opacity: 0; animation: starIn 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) forwards; }
  #stars .star > span { grid-row: span 2; font-size: 26px; line-height: 1; text-align: center; }
  #stars .star b { font-weight: normal; }
  #stars .star em { grid-column: 2; font-size: 11px; font-style: normal; color: var(--gold); }
  #stars .star.on { color: var(--ink); }
  #stars .star.on > span { color: var(--gold); text-shadow: 0 0 10px rgba(255, 200, 80, 0.6); }
  #xp { display: flex; flex-direction: column; gap: 6px; width: min(300px, 86vw); }
  #xp[hidden] { display: none; }
  #xp .xprow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; padding: 6px 10px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; color: var(--ink); }
  #xp .xprow em { font-style: normal; color: var(--gold); font-size: 12px; }
  #xp .xprow i { grid-column: span 2; display: block; height: 6px; background: #2a1a10; border-radius: 3px; overflow: hidden; }
  #xp .xprow i span { display: block; height: 100%; width: 0; background: #7cc0ff; transition: width 0.8s ease-out; }
  #xp .xprow p { grid-column: span 2; margin: 0; font-size: 12px; color: var(--gold); min-height: 0; }
  #xp .xprow p:empty { display: none; }
  #xp .xprow.up { animation: evolve 0.9s ease-out; }
  @keyframes starIn { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  #result .row { display: flex; gap: 10px; margin-top: 6px; }
  /* the fight's numbers: a row a hero, with a small bar for each number (the bars are scaled to the best hero) */
  #fightStats { display: flex; flex-direction: column; gap: 2px; width: min(330px, 92vw); padding: 6px 8px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; font-size: 12px; color: var(--ink); }
  #fightStats[hidden] { display: none; }
  #fightStats .srow { display: grid; grid-template-columns: 96px repeat(4, 1fr); align-items: center; gap: 8px; padding: 2px 0; }
  #fightStats .srow.head { font-size: 10px; color: var(--dim); }
  #fightStats .srow b { font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fightStats .srow b em { font-style: normal; color: var(--gold); }
  #fightStats .cell { display: grid; grid-template-columns: 1fr; gap: 2px; text-align: right; }
  #fightStats .srow.head span { text-align: right; }
  #fightStats .cell em { font-style: normal; font-size: 11px; }
  #fightStats .cell i { display: block; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; overflow: hidden; }
  #fightStats .cell i span { display: block; height: 100%; background: var(--gold); }
  /* the boss's title card: it glides in over the board and a tap skips it */
  #bossCard { position: fixed; left: 0; right: 0; top: 34%; z-index: 3; padding: 16px; text-align: center; cursor: pointer; background: linear-gradient(transparent, rgba(12, 6, 4, 0.85) 25%, rgba(12, 6, 4, 0.85) 75%, transparent); animation: fade 0.3s ease-out; transition: opacity 0.4s; }
  #bossCard[hidden] { display: none; }
  #bossCard.out { opacity: 0; }
  #bossCard b { display: block; font: bold clamp(22px, 7vw, 34px)/1.1 Georgia, serif; letter-spacing: 3px; color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, 0.8); animation: punch 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  #bossCard span { display: block; margin-top: 6px; color: var(--dim); font-style: italic; text-shadow: 0 1px 0 #000; }
  /* the boss's health, across the top under the title bar, with its name */
  #bossBar { position: fixed; left: 12px; right: 12px; z-index: 2; pointer-events: none; text-shadow: 0 1px 0 #000; }
  #bossBar[hidden] { display: none; }
  #bossBar b { display: block; font: bold 13px Georgia, serif; letter-spacing: 0.5px; color: var(--gold); }
  #bossBar i { display: block; height: 10px; margin-top: 2px; background: rgba(0, 0, 0, 0.5); border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }
  #bossBar i span { display: block; height: 100%; background: var(--red); transition: width 0.3s; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes punch { from { transform: scale(1.8); opacity: 0; } }


  /* recruiting */
  #gacha { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px); background: rgba(24, 12, 8, 0.96); overflow-y: auto; touch-action: pan-y; }
  #gacha[hidden] { display: none; }
  #gacha header { display: flex; align-items: center; gap: 10px; }
  #gacha h2 { margin: 0; flex: 1; font-size: 20px; color: var(--gold); }
  #crowns { color: var(--gold); font-weight: bold; }
  #gacha .pulls { display: flex; gap: 8px; }
  #gacha .pulls button { flex: 1; }
  #rates, #pity { font-size: 11px; color: var(--dim); text-align: center; }
  #reveal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; min-height: 96px; }
  .flip { position: relative; aspect-ratio: 3 / 4; perspective: 600px; }
  .flip .back, .flip .face { position: absolute; inset: 0; border-radius: 8px; border: 2px solid var(--edge); backface-visibility: hidden; transition: transform 0.5s; }
  .flip .back { background: repeating-linear-gradient(45deg, #5a3520, #5a3520 6px, #7a4a28 6px, #7a4a28 12px); }
  .flip .face { background: #2a1a10; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 2px; text-align: center; font-size: 10px; }
  .flip .face canvas { width: 100%; image-rendering: pixelated; }
  .flip .face em { font-style: normal; color: var(--gold); font-weight: bold; }
  .flip.up .back { transform: rotateY(-180deg); }
  .flip.up .face { transform: rotateY(0); }
  .flip.r1 .face { border-color: #9a9a9a; }
  .flip.r2 .face { border-color: #4a9cff; box-shadow: 0 0 10px #4a9cff; }
  .flip.r3 .face { border-color: var(--gold); box-shadow: 0 0 16px 3px var(--gold); }
  .flip.new .face em { color: #7cf07c; }
  #collection { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #collection .hero { text-align: center; font-size: 10px; background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; padding: 2px; }
  #collection .hero canvas { width: 100%; max-width: 56px; image-rendering: pixelated; }
  #collection .hero b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #collection .hero.r2 { border-color: #4a9cff; }
  #collection .hero.r3 { border-color: var(--gold); }
  #collection .hero.locked { filter: brightness(0.15) grayscale(1); }
  #collection .rank { display: block; color: var(--gold); }
  #collection .bar { display: block; height: 4px; margin: 2px 4px 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; overflow: hidden; }
  #collection .bar i { display: block; height: 100%; background: var(--gold); }
  @media (orientation: landscape) { #reveal { grid-template-columns: repeat(10, 1fr); } #collection { grid-template-columns: repeat(8, 1fr); } }

  /* the home screen: the castle between runs */
  #home { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px); background: #1c1410 center / cover no-repeat; image-rendering: pixelated; overflow-y: auto; touch-action: pan-y; }
  #home[hidden] { display: none; }
  #home::before { content: ''; position: fixed; inset: 0; background: linear-gradient(rgba(20, 10, 6, 0.35), rgba(20, 10, 6, 0.7)); pointer-events: none; }
  #home > * { position: relative; width: 100%; max-width: 440px; }
  #home h1 { margin: 0 0 4px; text-align: center; font: bold 30px/1.1 Georgia, serif; color: var(--gold); letter-spacing: 1px; text-shadow: 0 3px 0 #000, 0 0 18px rgba(0, 0, 0, 0.8); }
  #homeCrowns { text-align: center; color: var(--gold); font-weight: bold; margin-bottom: 10px; text-shadow: 0 1px 0 #000; }
  #homeBest { text-align: center; color: var(--ink); font-size: 13px; margin: -6px 0 10px; text-shadow: 0 1px 0 #000; }
  #homeBest[hidden] { display: none; }
  #homeNote { text-align: center; margin: 0 0 10px; padding: 8px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; color: var(--ink); }
  #homeNote[hidden] { display: none; }
  #homeMenu { display: grid; gap: 8px; padding: 12px; background: var(--wood); border: 2px solid var(--edge); border-radius: 10px; }
  #homeMenu button { font-size: 17px; padding: 13px 14px; }
  #homeMenu button[hidden], #homeMenu[hidden], #homePage[hidden] { display: none; }
  #homePage { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 110px); padding: 10px; background: var(--wood); border: 2px solid var(--edge); border-radius: 10px; }
  #homePage header { display: flex; align-items: center; gap: 10px; }
  #homePage h2 { margin: 0; flex: 1; font-size: 20px; color: var(--gold); }
  #homeBody { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; touch-action: pan-y; }
  #homeBody .hint { margin: 0; font-size: 11px; color: var(--dim); text-align: center; }
  .hrow, .brow { display: flex; gap: 8px; align-items: center; padding: 6px; background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; }
  .hrow.r2 { border-color: #4a9cff; }
  .hrow.r3 { border-color: var(--gold); }
  .hrow canvas { width: 64px; height: 64px; flex: none; image-rendering: pixelated; }
  .hrow.locked canvas { filter: brightness(0.15) grayscale(1); }
  .hrow b, .brow b { display: block; }
  .hrow em, .brow em { display: block; font-style: normal; font-size: 11px; color: var(--dim); }
  .hrow span { display: block; font-size: 11px; color: var(--gold); }
  .hrow p { margin: 2px 0 0; font-size: 11px; line-height: 1.25; }
  .xpbar { height: 5px; margin-top: 3px; background: #2a1a10; border-radius: 3px; overflow: hidden; }
  .xpbar span { display: block; height: 100%; background: #7cc0ff; }
  .hrow p i { font-style: normal; color: #7cc0ff; }
  .brow > div { flex: 1; }
  .brow .pips { color: var(--gold); letter-spacing: 2px; }
  .brow button { flex: none; min-width: 92px; }
  @media (orientation: landscape) {
    #home { justify-content: flex-start; }
    #home h1 { font-size: 24px; }
    #homeMenu { grid-template-columns: 1fr 1fr; }
    #homePage { max-height: calc(100vh - 80px); }
  }

  /* the settings page: over the home screen or the fight */
  #settings { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px); background: rgba(24, 12, 8, 0.96); overflow-y: auto; touch-action: pan-y; }
  #settings[hidden] { display: none; }
  #settings header { display: flex; align-items: center; gap: 10px; }
  #settings h2 { margin: 0; flex: 1; font-size: 20px; color: var(--gold); }
  #settingsBody { display: flex; flex-direction: column; gap: 8px; max-width: 480px; width: 100%; margin: 0 auto; }
  #settingsBody .hint { margin: 6px 0 0; font-size: 11px; color: var(--dim); text-align: center; }
  .setting { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 10px; background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; }
  .setting b { display: block; }
  .setting em { display: block; font-style: normal; font-size: 11px; color: var(--dim); }
  .setting input[type='range'] { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
  .setting .toggle, .setting .pair button { min-width: 64px; }
  .setting .toggle.on, .setting .pair button.on { background: linear-gradient(#c9762e, #8e4618); border-color: var(--gold); }
  .setting .pair { display: flex; gap: 6px; }
  /* the first-run tips: a speech bubble by the thing it talks about (placed in src/tips.ts), taps only on itself */
  #tip {
    position: fixed; z-index: 6; width: min(280px, calc(100vw - 24px)); padding: 10px 12px; background: var(--wood);
    border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6); font-size: 14px; line-height: 1.3;
  }
  #tip[hidden] { display: none; }
  #tip p { margin: 0 0 8px; }
  #tip .tipRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #tip button { padding: 7px 12px; font-size: 14px; }
  #tip #tipSkip { background: none; border-color: transparent; color: var(--dim); text-shadow: none; padding: 7px 4px; font-weight: normal; }
  #tip #tipSkip[hidden] { display: none; }
  #tip i { position: absolute; width: 0; height: 0; border: 9px solid transparent; }
  #tip[data-side='above'] i { bottom: -18px; left: calc(var(--ax) - 9px); border-top-color: var(--gold); }
  #tip[data-side='below'] i { top: -18px; left: calc(var(--ax) - 9px); border-bottom-color: var(--gold); }
  #tip[data-side='left'] i { right: -18px; top: calc(var(--ay) - 9px); border-left-color: var(--gold); }
  #tip[data-side='right'] i { left: -18px; top: calc(var(--ay) - 9px); border-right-color: var(--gold); }
  .tipLit { outline: 2px solid var(--gold); outline-offset: 3px; box-shadow: 0 0 14px var(--gold); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; color: var(--gold); }
  #version { position: fixed; right: 6px; bottom: 2px; font-size: 10px; color: rgba(255, 255, 255, 0.5); text-shadow: 0 1px 0 #000; pointer-events: none; }
  @media (orientation: portrait) { #version { bottom: auto; top: calc(env(safe-area-inset-top) + 34px); } }
</style>
