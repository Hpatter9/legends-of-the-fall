<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#3a2218" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<title>Legends of the Fall</title>
<style>
  @font-face { font-family: 'Cinzel Decorative'; font-weight: 700; font-display: swap; src: url(fonts/cinzel-decorative-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Cinzel Decorative'; font-weight: 900; font-display: swap; src: url(fonts/cinzel-decorative-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 400; font-display: swap; src: url(fonts/alegreya-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 700; font-display: swap; src: url(fonts/alegreya-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Press Start 2P'; font-weight: 400; font-display: swap; src: url(fonts/press-start-2p-latin-400-normal.woff2) format('woff2'); }
  :root {
    --ink: #f6ead6;
    --dim: #c8b394;
    --wood: rgba(38, 22, 14, 0.86);
    --edge: #8c5a32;
    --gold: #f0b44a;
    --red: #d9573f;
    --ember: #ff8a3c;
    --gold-hi: #ffe48a;
    --gold-lo: #b8761e;
    --deep: #1a0d07;
    --display: 'Cinzel Decorative', Georgia, serif;
    --body: 'Alegreya Sans', 'Trebuchet MS', Verdana, sans-serif;
    --pixel: 'Press Start 2P', monospace;
    --vw: min(1vw, 4.8px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #0c0705; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* the game is a phone-width column: on a wide desktop window it stays centred with the dark backdrop either side
     (the transform makes the column the box that the fixed layers fill) */
  body {
    max-width: 480px; margin: 0 auto; position: relative; transform: translateZ(0);
    background: #cdc8e0;
    image-rendering: pixelated;
    color: var(--ink);
    font: 16px/1.25 var(--body);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  /* the backdrop: parallax layers (render/backdrop.ts fills them in for the area), shifted a little by the pan */
  #sky { position: fixed; inset: 0; overflow: hidden; background: #1c1410; }
  #sky div { position: absolute; left: -12%; right: -12%; top: 0; bottom: 0; background: center bottom / auto 100% repeat-x; will-change: transform; }
  #sky::after { content: ''; position: absolute; inset: 0; background: var(--tint, linear-gradient(rgba(20, 10, 6, 0.1), rgba(20, 10, 6, 0.35))); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  button {
    font: inherit; font-weight: bold; color: var(--ink); background: #5a3520; border: 2px solid var(--edge);
    border-radius: 8px; padding: 10px 14px; cursor: pointer; text-shadow: 0 1px 0 #000;
  }
  button:active:not(:disabled) { transform: scale(0.94); }
  button.primary { background: linear-gradient(#c9762e, #8e4618); border-color: var(--gold); font-size: 17px; }
  button:disabled { opacity: 0.4; }

  #top {
    position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; background: linear-gradient(var(--wood), rgba(38, 22, 14, 0));
  }
  #top h1 { margin: 0; font-size: 16px; color: var(--gold); letter-spacing: 0.5px; white-space: nowrap; }
  #status { flex: 1; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { font-variant-numeric: tabular-nums; color: var(--ink); }
  #speed { padding: 4px 10px; display: none; }
  #mute, #gear { padding: 4px 8px; font-size: 14px; line-height: 1; }
  /* upright (a phone is narrow): the title, gold and buttons share the first row and the stage and status the second,
     which keeps clear of the version line at the top right; in a fight the title makes way for the clock */
  #top { flex-wrap: wrap; row-gap: 2px; }
  #top h1 { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  body[data-phase="fight"] #top h1 { display: none; }
  #gold { margin-right: auto; }
  #status { order: 1; flex: 1 1 100%; padding-right: 140px; font-size: 13px; }
  body[data-phase='fight'] #speed { display: block; }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    background: var(--wood); border-top: 2px solid var(--edge); display: flex; flex-direction: column; gap: 8px;
  }
  #benchWrap { position: relative; }
  #bench { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-height: 172px; overflow-y: auto; }
  .card {
    position: relative; background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; padding: 2px 2px 4px;
    text-align: center; touch-action: none;
  }
  .card canvas { width: 100%; max-width: 64px; aspect-ratio: 1; display: block; margin: 0 auto; image-rendering: pixelated; }
  .card em { position: absolute; top: 1px; left: 3px; font-style: normal; font-size: 10px; color: var(--gold); text-shadow: 0 1px 0 #000; }
  .card b { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card i { display: block; height: 4px; margin: 3px 4px 0; background: #2a1a10; border-radius: 2px; overflow: hidden; }
  .card i span { display: block; height: 100%; background: #5fd35f; }
  .card.g2 { border-color: #b8c8e0; box-shadow: 0 0 6px rgba(200, 220, 255, 0.45); background: linear-gradient(#2a3040, rgba(0, 0, 0, 0.35)); }
  .card.g3 { border-color: #f0c040; box-shadow: 0 0 9px rgba(255, 200, 70, 0.7), inset 0 0 8px rgba(255, 210, 90, 0.35); background: linear-gradient(#4a3810, rgba(0, 0, 0, 0.35)); }
  .card.g3 em { color: #ffe27a; }
  .card.evolve { animation: evolve 0.9s ease-out; }
  .card.evolve::before {
    content: ''; position: absolute; inset: -4px; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle, #fff 0%, rgba(255, 226, 122, 0.8) 35%, transparent 70%); animation: evolveFlash 0.9s ease-out forwards;
  }
  @keyframes evolve { 0% { transform: scale(0.8); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes evolveFlash { 0% { opacity: 1; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.7); } }
  /* (a hero on the field flies a crimson war banner with gold crossed blades from its corner, waving) */
  .card.placed::after {
    content: '⚔'; position: absolute; top: 0; right: 4px; width: 15px; height: 21px; padding-top: 1px; box-sizing: border-box;
    font-size: 9px; line-height: 1; color: #ffd86a; text-shadow: 0 0 3px rgba(255, 200, 80, 0.9), 0 1px 0 #000;
    background: linear-gradient(90deg, #7a0f14, #c4232b 45%, #8e1218); border-top: 2px solid #f0b44a;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6));
    transform-origin: top center; animation: banner 2.4s ease-in-out infinite;
  }
  .card.placed canvas { filter: drop-shadow(0 0 3px rgba(255, 196, 90, 0.55)); }
  @keyframes banner { 0%, 100% { transform: skewX(0deg) scaleY(1); } 30% { transform: skewX(-7deg) scaleY(0.96); } 65% { transform: skewX(5deg) scaleY(1.02); } }
  @media (prefers-reduced-motion: reduce) { .card.placed::after { animation: none; } }
  /* (while deploying, a hero already on the field leaves the bench; drag it off the board onto the panel to bring it back) */
  body[data-phase='deploy'] .card.placed { display: none; }
  body[data-phase='deploy'] #bench:not(:has(.card:not(.placed)))::before { content: 'Every hero is on the field'; grid-column: 1 / -1; padding: 10px 0; text-align: center; font-size: 12px; color: var(--dim); }
  .card.chosen { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .card .recycle {
    display: none; position: absolute; left: 2px; right: 2px; bottom: 2px; z-index: 2; padding: 3px 0; font: 700 10px/1 var(--body, sans-serif);
    color: #1a1008; background: #f0c040; border: 1px solid #8a5a1c; border-radius: 5px; touch-action: manipulation;
  }
  .card .recycle.sure { background: #e0603a; color: #fff; }
  body[data-phase='deploy'] .card.chosen .recycle { display: block; }
  .card.fallen { opacity: 0.4; filter: grayscale(1); }
  /* (during the fight the bar shows only the heroes on the field) */
  body:not([data-phase='deploy']) .card:not(.placed) { display: none; }
  #buttons { display: flex; gap: 8px; }
  #buttons #fight { flex: 1; }
  #buttons button:not(#fight) { padding: 10px 8px; font-size: 13px; }
  #gold { color: var(--gold); font-weight: bold; white-space: nowrap; }
  body:not([data-phase='deploy']) #buttons { display: none; }

  /* the king's spells: shown only during the fight */
  #spells { display: none; flex-direction: column; gap: 6px; }
  body[data-phase='fight'] #spells { display: flex; }
  #mana { display: flex; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  #mana i { flex: 1; height: 10px; background: #2a1a10; border: 1px solid #5a3a22; border-radius: 5px; overflow: hidden; }
  #mana i span { display: block; height: 100%; width: 0; background: linear-gradient(#7cc0ff, #3a78d6); }
  #spellCards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .spell {
    position: relative; overflow: hidden; padding: 5px 2px 4px; text-align: center; font-size: 12px; line-height: 1.2;
    background: rgba(0, 0, 0, 0.35); border: 2px solid #5a3a22; border-radius: 8px; color: var(--ink);
  }
  .spell b { display: block; }
  .spell em { font-style: normal; color: #7cc0ff; }
  .spell .cool { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0, 0, 0, 0.55); pointer-events: none; }
  .spell.dim { opacity: 0.45; filter: grayscale(0.8); }
  .spell.armed { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); opacity: 1; filter: none; }
  #spellHint { min-height: 14px; font-size: 11px; color: var(--dim); text-align: center; }

  /* the trait strip, in the deploy phase only */
  #traits { display: flex; gap: 5px; overflow-x: auto; min-height: 32px; }
  #traitHint { min-height: 13px; font-size: 11px; color: var(--dim); text-align: center; }
  body:not([data-phase='deploy']) #traits, body:not([data-phase='deploy']) #traitHint { display: none; }
  .trait { flex: none; padding: 3px 8px; font-size: 12px; border-radius: 12px; border: 1px solid #5a3a22; background: rgba(0, 0, 0, 0.35); color: var(--dim); }
  .trait.class { border-style: dashed; }
  .trait.on { color: #1a1008; background: var(--gold); border-color: var(--gold); font-weight: bold; }
  .trait.picked { outline: 2px solid #7cc0ff; }
  .trait small { display: block; font-size: 9px; font-weight: normal; line-height: 1.1; opacity: 0.8; white-space: nowrap; }
  .trait.wake { animation: traitWake 0.9s ease-out 1; }
  #traitHint.wake { color: var(--gold); animation: traitHintWake 0.9s ease-out 1; }
  @keyframes traitWake { 0% { transform: scale(1.35); box-shadow: 0 0 16px 4px rgba(255, 220, 120, 0.95); } 100% { transform: none; } }
  @keyframes traitHintWake { 0% { opacity: 0; } 100% { opacity: 1; } }
  .card .lv { display: block; font-size: 9px; line-height: 1; color: #cfc3b0; }
  .card small { display: flex; justify-content: center; gap: 2px; margin-top: 1px; }
  .card small span { font-size: 9px; line-height: 1; padding: 1px 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); color: #cfc3b0; }


  #result {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px;
    background: rgba(12, 6, 4, 0.55); animation: fade 0.4s ease-out;
    /* (a long report scrolls, and its button rides along at the foot so it can always be pressed) */
    overflow-y: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top) + 16px) 12px 0;
  }
  #result > * { flex: none; }
  #result > .row { position: sticky; bottom: 0; margin-top: auto; padding: 10px 0 calc(env(safe-area-inset-bottom) + 14px); width: 100%; justify-content: center;
    background: linear-gradient(rgba(12, 6, 4, 0), rgba(12, 6, 4, 0.92) 40%); }
  #result[hidden] { display: none; }
  /* (an army wave won: the next section falls into place and the party walks across it behind the recap, which shows only its banner until they have arrived) */
  #result > :is(#stars, #armyStars, #xp, #fightStats) { transition: opacity 0.6s ease-out; }
  body[data-move] #result { background: none; }
  body[data-move] #result > :is(#stars, #armyStars, #xp, #fightStats) { opacity: 0; pointer-events: none; }
  #banner { font: bold 46px/1 var(--display); letter-spacing: 2px; text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, 0.8); animation: punch 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
  #banner.won { color: var(--gold); }
  #banner.lost { color: var(--red); }
  #summary { color: var(--dim); text-shadow: 0 1px 0 #000; }
  #stars, #armyStars { display: flex; flex-direction: column; gap: 6px; width: min(300px, calc(86 * var(--vw))); }
  #stars[hidden], #armyStars[hidden] { display: none; }
  #stars .star { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 0 8px; padding: 6px 10px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; color: var(--dim); opacity: 0; animation: starIn 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) forwards; }
  #stars .star > span { grid-row: span 2; font-size: 26px; line-height: 1; text-align: center; }
  #stars .star b { font-weight: normal; }
  #stars .star em { grid-column: 2; font-size: 11px; font-style: normal; color: var(--gold); }
  #stars .star.on { color: var(--ink); }
  #stars .star.on > span { color: var(--gold); text-shadow: 0 0 10px rgba(255, 200, 80, 0.6); }
  #stars .star.on > span { animation: twinkle 1.6s ease-in-out 0.5s infinite; }
  @keyframes twinkle { 50% { transform: scale(1.22) rotate(12deg); text-shadow: 0 0 16px rgba(255, 220, 120, 0.9); } }
  #xp { display: flex; flex-direction: column; gap: 6px; width: min(300px, calc(86 * var(--vw))); }
  #xp[hidden] { display: none; }
  #xp .xprow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; padding: 6px 10px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; color: var(--ink); }
  #xp .xprow em { font-style: normal; color: var(--gold); font-size: 12px; }
  #xp .xprow i { grid-column: span 2; display: block; height: 6px; background: #2a1a10; border-radius: 3px; overflow: hidden; }
  #xp .xprow i span { display: block; height: 100%; width: 0; background: #7cc0ff; transition: width 0.8s ease-out; }
  #xp .xprow p { grid-column: span 2; margin: 0; font-size: 12px; color: var(--gold); min-height: 0; }
  #xp .xprow p:empty { display: none; }
  #xp .xprow.up { animation: evolve 0.9s ease-out; }
  /* the level-up's light pillar: the six 32px frames of pillar_light, scaled to 120px, rising over the card then fading */
  #xp .xprow { position: relative; overflow: visible; }
  /* (the after-wave XP rows: a face with its level badge, the name and XP, the bar; a level-up stamps "Level up!", ticks the
     badge over, pops in its gains, sweeps a light across the row and bursts sparks from the face, all once) */
  #xp .xprow { grid-template-columns: auto 1fr auto; }
  #xp .xprow .xpFace { grid-row: span 3; position: relative; width: 60px; height: 60px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.4); border: 2px solid #6b4128; }
  #xp .xprow .xpFace.g2 { border-color: #b8c8e0; } #xp .xprow .xpFace.g3 { border-color: #f0c040; background: rgba(74, 56, 16, 0.6); }
  #xp .xprow .xpFace canvas { width: 56px; height: 56px; image-rendering: pixelated; display: block; }
  #xp .xprow .xpLv { position: absolute; right: -6px; bottom: -6px; padding: 1px 3px; font-family: var(--pixel); font-size: 8px; color: #fff; background: #3a2214; border: 1px solid var(--gold-lo); }
  #xp .xprow i, #xp .xprow p { grid-column: 2 / span 2; }
  #xp .xprow p { display: flex; flex-wrap: wrap; gap: 4px; }
  #xp .xprow p span { padding: 1px 5px; font-family: var(--pixel); font-size: 8px; color: #2a1606; background: linear-gradient(#ffe48a, #e8a93a); border: 1px solid #fff2c0; box-shadow: 0 1px 0 #000; animation: xpChip 0.3s steps(3) both; }
  #xp .xprow.up { border-color: #ffd36a; box-shadow: 0 0 0 2px var(--deep), 0 0 12px rgba(255, 200, 90, 0.55); overflow: hidden; }
  #xp .xprow.up .xpFace { border-color: #ffd36a; }
  #xp .xprow.up .xpLv { color: #2a1606; background: #ffd36a; animation: xpBump 0.45s steps(4) both; }
  #xp .xprow.up::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255, 240, 190, 0.45), transparent); transform: translateX(-120%); animation: xpShine 0.7s ease-out 0.1s forwards; }
  #xp .xprow .xpStamp { display: inline-block; margin-left: 8px; vertical-align: 2px; padding: 2px 5px; font-family: var(--pixel); font-size: 8px; color: #fff; background: #c4232b; border: 2px solid #ffd36a; box-shadow: 0 2px 0 #000; transform: rotate(-6deg); animation: xpStamp 0.4s steps(4) both; }
  #xp .xprow .xpWash { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(255, 214, 110, 0.55), rgba(255, 190, 80, 0.35) 60%, rgba(255, 190, 80, 0.1)); transform-origin: 30px 50%; transform: scaleX(0); animation: xpWash 0.9s ease-out forwards; }
  @keyframes xpWash { 0% { transform: scaleX(0); opacity: 1; } 45% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  #xp .xprow .xpSparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #xp .xprow .xpSparks i { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; background: #ffe48a; box-shadow: 0 0 3px #ffd36a; animation: xpSpark 0.8s ease-out forwards; }
  @keyframes xpChip { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes xpBump { 0% { transform: scale(1); } 50% { transform: scale(2); } 100% { transform: scale(1); } }
  @keyframes xpShine { to { transform: translateX(280%); } }
  @keyframes xpStamp { 0% { transform: rotate(-6deg) scale(3); opacity: 0; } 70% { transform: rotate(-6deg) scale(0.9); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); opacity: 1; } }
  @keyframes xpSpark { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #xp .xprow p span, #xp .xprow.up .xpLv, #xp .xprow .xpStamp { animation: none; } #xp .xprow.up::after, #xp .xprow .xpSparks, #xp .xprow .xpWash { display: none; } }
  #xp .xprow .pillar { position: absolute; left: 50%; bottom: 0; width: 120px; height: 120px; margin-left: -60px; pointer-events: none; mix-blend-mode: screen; background: 0 0 / 720px 120px no-repeat; animation: pillarFrames 0.9s steps(6, jump-none) forwards, pillarFade 0.9s linear forwards; }
  @keyframes pillarFrames { from { background-position: 0 0; } to { background-position: -600px 0; } }
  @keyframes pillarFade { 0%, 50% { opacity: 1; } to { opacity: 0; } }
  @keyframes starIn { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  #result .row { display: flex; gap: 10px; margin-top: 6px; }
  /* the fight's numbers: a row a hero, with a small bar for each number (the bars are scaled to the best hero) */
  #fightStats { display: flex; flex-direction: column; gap: 2px; width: min(330px, calc(92 * var(--vw))); padding: 6px 8px; background: var(--wood); border: 2px solid var(--edge); border-radius: 8px; font-size: 12px; color: var(--ink); }
  #fightStats[hidden] { display: none; }
  #fightStats .srow { display: grid; grid-template-columns: 96px repeat(4, minmax(0, 1fr)); align-items: center; gap: 8px; padding: 2px 0; }
  #fightStats .srow.head { font-size: 10px; color: var(--dim); }
  #fightStats .srow b { font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fightStats .srow b em { font-style: normal; color: var(--gold); }
  #fightStats .cell { display: grid; grid-template-columns: 1fr; gap: 2px; text-align: right; }
  #fightStats .srow.head span { text-align: right; }
  #fightStats .cell em { font-style: normal; font-size: 11px; }
  #fightStats .cell i { display: block; height: 4px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; overflow: hidden; }
  #fightStats .cell i span { display: block; height: 100%; background: var(--gold); }
  /* the boss's intro: the screen dims, the portrait slides in, the ribbon with its name slams down, a tap skips it */
  #bossCard { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 6px 12vh; text-align: center; cursor: pointer; background: rgba(8, 4, 2, 0.74); animation: bcDim 0.3s ease-out; transition: opacity 0.4s; }
  #bossCard[hidden] { display: none; }
  #bossCard.out { opacity: 0; }
  #bossCard::after { content: ''; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; animation: bcFlash 0.12s ease-out 0.85s; }
  #bossCard canvas { image-rendering: pixelated; animation: bcPort 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.6)); }
  #bossCard .rib { max-width: 100%; animation: bcSlam 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) 0.8s both; }

  /* the settings page: over the home screen or the fight */
  #settings { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px); background: rgba(24, 12, 8, 0.96); overflow-y: auto; touch-action: pan-y; }
  #settings[hidden] { display: none; }

  /* the first-run tips: a speech bubble by the thing it talks about (placed in src/tips.ts), taps only on itself */
  #tip {
    position: fixed; z-index: 6; width: min(280px, calc(calc(100 * var(--vw)) - 24px)); padding: 10px 12px; background: var(--wood);
    border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6); font-size: 14px; line-height: 1.3;
  }

  #tip #tipSkip[hidden] { display: none; }

  #tip[data-side='above'] i { bottom: -18px; left: calc(var(--ax) - 9px); border-top-color: var(--gold); }
  #tip[data-side='below'] i { top: -18px; left: calc(var(--ax) - 9px); border-bottom-color: var(--gold); }
  #tip[data-side='left'] i { right: -18px; top: calc(var(--ay) - 9px); border-left-color: var(--gold); }
  #tip[data-side='right'] i { left: -18px; top: calc(var(--ay) - 9px); border-right-color: var(--gold); }
  .tipLit { outline: 2px solid var(--gold); outline-offset: 3px; box-shadow: 0 0 14px var(--gold); }

  /* ---- the loading screen: a Knight against the Demon Lord on a dusk battlefield, in pure CSS and DOM sprites (the two attack strips and the
     slash and impact bursts are inlined by build.mjs, so it is on screen before game.js has downloaded). The fight loops (steps and whole
     pixels only, nothing fades or flashes); `--s` is the pixel scale of the sprites. ---- */
  #loading { --s: 2; position: fixed; inset: 0; z-index: 30; overflow: hidden; display: grid; place-items: center; color: var(--gold); background: #0b0510; image-rendering: pixelated; font-size: 18px; }
  #loading > * { position: absolute; pointer-events: none; }
  .ldSky { inset: 0 0 28% 0; background: linear-gradient(#0b0510 0 14%, #1a0a22 14% 27%, #2e0f30 27% 39%, #4a1534 39% 50%, #7a1f36 50% 60%, #b8392c 60% 68%, #e8702c 68% 78%, #ffb04a 78%); }
  .ldMoon { left: 60%; top: 24%; width: 88px; height: 88px; border-radius: 50%; background: radial-gradient(circle at 36% 36%, #fff2d0 0 28%, #f6c880 28% 58%, #d8905a 58% 80%, #b8683e 80%); box-shadow: 0 0 0 8px rgba(255, 170, 100, 0.14), 0 0 0 20px rgba(255, 150, 90, 0.08); }
  .ldRidge { left: 0; right: 0; bottom: 28%; }
  .ldRidge.a { height: 24%; background: #3a1230; clip-path: polygon(0 100%, 0 52%, 9% 30%, 17% 58%, 26% 18%, 37% 62%, 46% 36%, 57% 70%, 68% 24%, 79% 60%, 88% 34%, 100% 56%, 100% 100%); }
  .ldRidge.b { height: 15%; background: #1c0a1a; clip-path: polygon(0 100%, 0 40%, 12% 66%, 22% 20%, 33% 60%, 44% 30%, 55% 74%, 66% 36%, 77% 68%, 90% 22%, 100% 58%, 100% 100%); }
  .ldGround { inset: 72% 0 0 0; background: linear-gradient(#ff8a2a 0 4px, #8a2410 4px 8px, #3a1210 8px 28px, #230b0c 28px 64px, #170709 64px); }
  .ldVig { inset: 0; background: radial-gradient(ellipse at 50% 52%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.55) 100%); }
  .ldEmbers { inset: 0; overflow: hidden; }
  .ldEmbers i { position: absolute; left: var(--x); bottom: -8px; width: 4px; height: 4px; background: #ff9a3a; box-shadow: 0 0 0 2px rgba(255, 90, 30, 0.25); animation: ldEmber var(--t) steps(240) var(--d) infinite; }
  @keyframes ldEmber { to { translate: var(--dx, 0px) -960px; } }
  .ldFight { left: 0; right: 0; bottom: calc(28% - 22px); height: calc(var(--s) * 125px); }
  .ldK, .ldD { position: absolute; bottom: 0; background-repeat: no-repeat; background-position: 0 0; animation-timing-function: step-end; animation-iteration-count: infinite; animation-duration: 2.8s; }
  .ldK { z-index: 2; left: calc(50% - var(--s) * 154px); width: calc(var(--s) * 180px); height: calc(var(--s) * 76px); background-image: url(__LD_KNIGHT__); background-size: calc(var(--s) * 900px) calc(var(--s) * 76px); animation-name: ldKnight; }
  .ldD { z-index: 1; left: calc(50% - var(--s) * 34px); width: calc(var(--s) * 128px); height: calc(var(--s) * 125px); background-image: url(__LD_DEMON__); background-size: calc(var(--s) * 640px) calc(var(--s) * 125px); scale: -1 1; animation-name: ldDemon; }
  @keyframes ldKnight {
    0% { background-position-x: 0; translate: 0 0; }
    5% { background-position-x: calc(var(--s) * -180px); translate: calc(var(--s) * -2px) 0; }
    10% { background-position-x: calc(var(--s) * -360px); translate: 0 0; }
    15% { background-position-x: calc(var(--s) * -540px); translate: calc(var(--s) * 6px) 0; }
    20% { background-position-x: calc(var(--s) * -720px); translate: calc(var(--s) * 14px) 0; }
    36% { background-position-x: 0; translate: calc(var(--s) * 4px) 0; }
    42% { translate: 0 0; }
    68% { translate: calc(var(--s) * -6px) 0; }
    78% { translate: calc(var(--s) * -3px) 0; }
    86%, 100% { translate: 0 0; }
  }
  @keyframes ldDemon {
    0% { background-position-x: 0; translate: 0 0; }
    50% { background-position-x: calc(var(--s) * -128px); translate: calc(var(--s) * 2px) 0; }
    56% { background-position-x: calc(var(--s) * -256px); translate: 0 0; }
    62% { background-position-x: calc(var(--s) * -384px); translate: calc(var(--s) * -6px) 0; }
    68% { background-position-x: calc(var(--s) * -512px); translate: calc(var(--s) * -14px) 0; }
    84% { background-position-x: 0; translate: calc(var(--s) * -4px) 0; }
    90%, 100% { translate: 0 0; }
  }
  /* (the clash: where the two blades meet, a little right of the middle) */
  .ldClash { position: absolute; z-index: 3; left: calc(50% + var(--s) * 14px); bottom: calc(var(--s) * 44px); width: 0; height: 0; }
  .ldClash > * { position: absolute; opacity: 0; animation-duration: 2.8s; animation-iteration-count: infinite; animation-timing-function: step-end; }
  .ldImp { left: -72px; top: -72px; width: 144px; height: 144px; background: url(__LD_IMPACT__) 0 0 / 1008px 144px no-repeat; animation-name: ldImpact; }
  .ldImp.k { animation-delay: 0.6s; }
  .ldImp.d { animation-delay: 1.9s; }
  @keyframes ldImpact { 0% { opacity: 1; background-position-x: 0; } 1.5% { background-position-x: -144px; } 3% { background-position-x: -288px; } 4.5% { background-position-x: -432px; } 6% { background-position-x: -576px; } 7.5% { background-position-x: -720px; } 9% { background-position-x: -864px; } 10.5%, 100% { opacity: 0; } }
  .ldCut { left: -150px; top: -86px; width: 128px; height: 128px; background: url(__LD_SLASH__) 0 0 / 768px 128px no-repeat; animation-name: ldSlash; animation-delay: 0.5s; }
  @keyframes ldSlash { 0% { opacity: 1; background-position-x: 0; } 1.6% { background-position-x: -128px; } 3.2% { background-position-x: -256px; } 4.8% { background-position-x: -384px; } 6.4% { background-position-x: -512px; } 8% { background-position-x: -640px; } 9.6%, 100% { opacity: 0; } }
  .ldSp { left: 0; top: 0; width: 0; height: 0; opacity: 1; animation: none; }
  .ldSp i { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; background: #ffe48a; opacity: 0; animation: ldSpark 2.8s steps(4) infinite; }
  .ldSp.k i { animation-delay: 0.6s; }
  .ldSp.d i { animation-delay: 1.9s; background: #ff9a3a; }
  @keyframes ldSpark { 0% { opacity: 1; translate: 0 0; } 12% { opacity: 1; translate: var(--dx) var(--dy); } 12.1%, 100% { opacity: 0; translate: var(--dx) var(--dy); } }
  .ldTitle { left: 0; right: 0; top: calc(env(safe-area-inset-top) + 9%); margin: 0; text-align: center; font: 900 40px/1 Georgia, 'Times New Roman', serif; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-hi); text-shadow: 0 3px 0 #7a3a08, 0 6px 0 #2a0a06, 3px 0 0 #2a0a06, -3px 0 0 #2a0a06, 0 -3px 0 #2a0a06; }
  .ldTitle small { display: block; margin-top: 8px; font-size: 20px; letter-spacing: 8px; color: var(--gold); text-shadow: 0 2px 0 #2a0a06, 2px 0 0 #2a0a06, -2px 0 0 #2a0a06, 0 -2px 0 #2a0a06; }
  .ldLine { left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 12%); margin: 0; text-align: center; font: 900 16px Georgia, 'Times New Roman', serif; letter-spacing: 4px; text-transform: uppercase; color: var(--ink); text-shadow: 0 2px 0 #000; }
  .ldBar { left: 50%; bottom: calc(env(safe-area-inset-bottom) + 8%); width: 160px; height: 8px; margin-left: -80px; background: #1a0a12; border: 2px solid #5a3220; box-sizing: content-box; overflow: hidden; }
  .ldBar i { position: absolute; top: 0; left: 0; width: 40px; height: 100%; background: var(--gold); animation: ldMarch 1.6s steps(16) infinite; }
  @keyframes ldMarch { from { translate: -40px 0; } to { translate: 160px 0; } }
  @media (min-width: 700px) { #loading { --s: 3; } .ldTitle { font-size: 56px; } }
  @media (prefers-reduced-motion: reduce) { .ldK, .ldD, .ldEmbers i, .ldBar i, .ldClash > *, .ldSp i { animation: none; } .ldImp, .ldCut, .ldSp i { display: none; } }
  #version { position: fixed; right: 6px; bottom: 2px; font-size: 10px; color: rgba(255, 255, 255, 0.5); text-shadow: 0 1px 0 #000; pointer-events: none; }
  #version { bottom: auto; top: calc(env(safe-area-inset-top) + 34px); }
  /* The party screen (src/party.ts): five slots, the traits they wake, the heroes to pick from, and the button to start */
  #party { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); background: rgba(24, 12, 8, 0.97); animation: fade 0.2s ease-out; }
  #party[hidden], #ptSheet[hidden] { display: none; }
  #party > header { display: flex; align-items: center; gap: 10px; }
  #ptSuggest { margin-left: auto; }
  #party h2 { margin: 0; flex: 1; font-size: 20px; color: var(--gold); }
  #ptSlots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .ptSlot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; min-height: 82px; padding: 4px 2px; background: rgba(0, 0, 0, 0.35); border: 2px dashed #6b4128; border-radius: 10px; font-weight: normal; }

  .ptSlot canvas { width: 48px; height: 48px; image-rendering: pixelated; }
  .ptSlot small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  #ptHint { margin: 0; font-size: 12px; color: var(--dim); text-align: center; }
  #ptHint.full { color: #ffb08a; }
  #ptTraits { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); }
  #ptTraits:empty { display: none; }
  .ptTrait.on { color: #ffe9a8; }
  .ptTrait b { margin-right: 6px; font-weight: bold; }
  #ptGrid { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-content: start; }
  .ptCard { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .ptCard.picked { outline: 3px solid #ffe48a; outline-offset: -3px; }
  .ptCard.locked { filter: grayscale(1) brightness(0.4); opacity: 0.6; }
  .ptCard .ptTags { font-size: 9px; color: var(--dim); }
  .ptInfo { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; font: bold italic 12px/18px Georgia, serif; text-align: center; color: var(--gold); background: rgba(0, 0, 0, 0.55); }
  #ptGo { width: 100%; padding: 12px; font-size: 18px; }
  #ptSheet { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(12, 6, 4, 0.75); animation: fade 0.2s ease-out; }

  /* ---- the skin: dark fantasy, autumn and gold. Shared panel, button and title looks; the screens that build their own
     overlay (spellbook, party picker, ...) pick it up through the same classes and the body prefix. ---- */
  h1, h2, h3, #banner, #bossCard b, #bossBar b { font-family: var(--display); }
  button { font-family: var(--body); font-weight: 700; font-size: 15px; letter-spacing: 0.3px; border-radius: 9px; border: 2px solid var(--gold-lo);
    background: linear-gradient(#6b3f24, #3e2214); box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.3), inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 2px 0 var(--deep), 0 3px 6px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s cubic-bezier(0.3, 1.8, 0.5, 1), box-shadow 0.12s, filter 0.15s; }
  button:active:not(:disabled) { transform: translateY(2px) scale(0.95); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 0 var(--deep); filter: brightness(1.15); }
  button.primary, .setting .toggle.on, .setting .pair button.on { position: relative; overflow: hidden; color: #3a1a06; text-shadow: 0 1px 0 rgba(255, 240, 190, 0.6);
    background: linear-gradient(var(--gold-hi), #f0a030 55%, #c8741a); border: 2px solid #fff2c0; font-family: var(--display); font-weight: 900; font-size: 15px;
    box-shadow: inset 0 -3px 0 rgba(140, 70, 10, 0.5), 0 3px 0 #7a410f, 0 0 14px rgba(255, 170, 60, 0.45); }
  button.primary::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent); transform: skewX(-18deg); animation: shimmer 3.2s ease-in-out infinite; }
  button.primary:disabled::after { animation: none; opacity: 0; }
  .setting .toggle.on, .setting .pair button.on { font-family: var(--body); font-size: 14px; }
  @keyframes shimmer { 0%, 55% { left: -60%; } 100% { left: 130%; } }

  /* framed panels: a gold rim, a dark inner rim, parchment-dark wood, corner studs */
  :root { --panel-bg: linear-gradient(rgba(255, 190, 110, 0.07), rgba(0, 0, 0, 0) 40%), linear-gradient(#3b2316, #26150d);
    --frame: 0 0 0 2px var(--gold-lo), 0 0 0 4px var(--deep), inset 0 0 0 2px rgba(255, 210, 130, 0.18), 0 8px 22px rgba(0, 0, 0, 0.65); }
  .hmPanel, .hsheet, .evcard, #tip { background: var(--panel-bg); border: 2px solid var(--gold-hi); border-radius: 12px; outline: 0; box-shadow: var(--frame); }
  .hmPanel { border-width: 2px; margin: 4px auto; max-width: 436px; }
  .hmNote, .toast { background: var(--panel-bg); border: 2px solid var(--gold-lo); box-shadow: 0 0 0 2px var(--deep), 0 4px 12px rgba(0, 0, 0, 0.6); font-family: var(--body); }
  .hmPanel h2, .evcard h2, #hmSub h2, #settings h2, #gacha h2, body #spellbook h2 { font-family: var(--display); font-weight: 900; color: var(--gold-hi); letter-spacing: 1px;
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(255, 160, 50, 0.45); }
  #hmSub h2, #settings h2, #gacha h2, body #spellbook h2 { font-size: 22px; }
  /* a title with a ribbon: the screen titles sit on a swallow-tailed band */
  .ribbon, #hmSub h2, #settings h2, #gacha h2, body #spellbook h2, .evcard h2 { position: relative; }
  #hmSub h2, #settings h2, #gacha h2, body #spellbook h2 { padding: 6px 18px 5px; flex: 0 1 auto; margin-right: auto; background: linear-gradient(#7a2a1c, #4e180f); border-top: 2px solid #d9573f; border-bottom: 2px solid #2a0a06;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%); filter: drop-shadow(0 2px 0 #000); }
  #hmSub header, #settings header, #gacha header, body #spellbook header { padding-bottom: 8px; border-bottom: 2px solid var(--gold-lo); box-shadow: 0 2px 0 var(--deep); }
  #hmSub, #settings, #gacha, body #spellbook { background: radial-gradient(ellipse at 50% 0, rgba(120, 60, 24, 0.5), rgba(24, 12, 8, 0.97) 70%), rgba(24, 12, 8, 0.97); }
  #hmTop { background: linear-gradient(#4a2c1c, #24130c); border-bottom: 3px solid var(--gold-lo); box-shadow: 0 1px 0 var(--gold-hi), 0 3px 10px rgba(0, 0, 0, 0.7); }
  #hmTabs { background: linear-gradient(#3a2218, #170b06); border-top: 3px solid var(--gold-lo); box-shadow: 0 -1px 0 var(--gold-hi), 0 -3px 10px rgba(0, 0, 0, 0.7); }
  .hmTab { font-family: var(--body); font-weight: 700; font-size: 12px; letter-spacing: 0.4px; }
  .hmTab.hero { font-family: var(--display); font-weight: 900; font-size: 12px; }
  #panel { background: linear-gradient(#3a2218, #1d0f08); border-top: 3px solid var(--gold-lo); box-shadow: 0 -1px 0 var(--gold-hi), 0 -4px 12px rgba(0, 0, 0, 0.6); }
  #top h1 { font-size: 15px; font-weight: 900; text-shadow: 0 2px 0 #000, 0 0 10px rgba(255, 150, 40, 0.5); }
  #top h1 { font-size: 13px; }
  #gold, #clock, .chip, #crowns, #mana b { font-family: var(--pixel); font-size: 11px; font-weight: 400; letter-spacing: 0; text-shadow: 0 1px 0 #000; }
  #status { font-size: 15px; }
  .chip { font-size: 12px; background: linear-gradient(#0f0704, #1d0f08); border-color: var(--gold-lo); }
  .round { background: linear-gradient(#6b3f24, #3e2214); border-color: var(--gold); }
  #hmBest { font-size: 13px; }

  /* cards: bench, spells, heroes, traits */
  .card, .spell, .hcard, .hrow, .brow, .setting, .sbCard, .sbSlot { background: linear-gradient(rgba(255, 190, 110, 0.06), rgba(0, 0, 0, 0.25)), #2a1a10; border: 2px solid #6b4128;
    box-shadow: inset 0 1px 0 rgba(255, 210, 140, 0.14), 0 2px 4px rgba(0, 0, 0, 0.4); }
  .card.g2 { background: linear-gradient(#2a3040, rgba(0, 0, 0, 0.35)); } .card.g3 { background: linear-gradient(#4a3810, rgba(0, 0, 0, 0.35)); }
  .card.chosen { box-shadow: 0 0 0 1px var(--gold-hi), 0 0 14px var(--ember); }
  .card b, .spell b, .hcard b, .hrow b, .brow b, .setting b, .evcard .opt b { font-family: var(--body); font-weight: 700; }
  .card b { font-size: 12px; } .spell { font-size: 13px; } .spell em, #mana b, .card em { font-family: var(--pixel); font-size: 8px; }
  .spell.armed { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold), 0 0 16px var(--ember); animation: armed 0.9s ease-in-out infinite alternate; }
  @keyframes armed { to { box-shadow: 0 0 0 1px var(--gold), 0 0 24px var(--ember); } }
  #mana i { height: 12px; border: 2px solid var(--gold-lo); background: #12090a; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.7); }
  #mana i span { background: linear-gradient(#9fd4ff, #3a78d6); box-shadow: 0 0 8px rgba(100, 170, 255, 0.7); }
  .trait { font-family: var(--body); font-size: 13px; border-color: #6b4128; }
  .trait.on { background: linear-gradient(var(--gold-hi), #e0912a); box-shadow: 0 0 8px rgba(255, 180, 70, 0.6); }
  .hint, .hmCard small, .hstats small, .evcard .opt small { font-size: 12px; }
  .hmCard { background: var(--panel-bg); border: 2px solid var(--gold-lo); box-shadow: 0 0 0 2px var(--deep), 0 3px 8px rgba(0, 0, 0, 0.6); }
  .hmCard b { font-family: var(--display); font-weight: 700; font-size: 12px; }
  .hmCard img, .round img, .chip img, .hmTab img { image-rendering: pixelated; }
  .hstats b, .hrow span, .brow .pips { font-family: var(--pixel); font-size: 12px; font-weight: 400; }
  .hmBanner { font-weight: 900; background: linear-gradient(#7a2a1c, #4e180f); border: 3px solid var(--gold-lo); border-radius: 4px 4px 22px 22px;
    box-shadow: 0 0 0 2px var(--deep), 0 4px 12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 180, 140, 0.4); color: var(--gold-hi); }
  .hmBattle { font-weight: 900; font-size: 32px; letter-spacing: 3px; position: relative; overflow: hidden; }
  .hmBattle::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 35%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.6), transparent); transform: skewX(-18deg); animation: shimmer 3s ease-in-out infinite; }
  .hmBattle small, .hmBig small { font-family: var(--body); }
  .hmBig { font-family: var(--display); font-weight: 900; font-size: 20px; }

  /* the result: a ribboned banner over a dim vignette */
  #result { background: radial-gradient(ellipse at center, rgba(40, 14, 6, 0.55), rgba(8, 3, 2, 0.88)); }
  #banner { padding: 8px 34px 10px; font-weight: 900; font-size: clamp(30px, calc(11 * var(--vw)), 46px); background: linear-gradient(#5a1c12, #34100a); border-top: 3px solid var(--gold); border-bottom: 3px solid var(--gold);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 50%, 100% 100%, 0 100%, 18px 50%); filter: drop-shadow(0 4px 0 #000); }
  #banner.won { color: var(--gold-hi); text-shadow: 0 3px 0 #000, 0 0 22px rgba(255, 190, 70, 0.9); }
  #banner.lost { color: #ff7a5a; background: linear-gradient(#2a1a1a, #14090a); text-shadow: 0 3px 0 #000, 0 0 18px rgba(255, 60, 30, 0.6); }
  #summary { font-size: 16px; max-width: min(340px, calc(90 * var(--vw))); text-align: center; }
  #stars .star, #xp .xprow, #fightStats { background: var(--panel-bg); border: 2px solid var(--gold-lo); box-shadow: 0 0 0 2px var(--deep), 0 3px 8px rgba(0, 0, 0, 0.55); }
  #xp .xprow em, #fightStats .cell em, #fightStats .srow.head { font-family: var(--pixel); font-size: 8px; }
  #xp .xprow i span { background: linear-gradient(#9fd4ff, #3a78d6); }
  #bossBar i { border-color: var(--gold-lo); background: #12090a; }
  #bossBar i span { background: linear-gradient(#ff8a5a, #a82818); box-shadow: 0 0 8px rgba(255, 90, 40, 0.7); }
  #bossCard b { font-weight: 900; }

  /* modals slide up, the pages ease in; the tip bubble gets the framed look */
  .hsheet, .evcard { animation: slideUp 0.3s cubic-bezier(0.2, 1.3, 0.4, 1); }
  #hmSub, #settings, #gacha, body #spellbook { animation: slideUp 0.28s ease-out; }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } }
  #tip { border-color: var(--gold-hi); font-size: 16px; } #tip button { font-size: 14px; }
  #tip[data-side='above'] i { border-top-color: var(--gold-hi); } #tip[data-side='below'] i { border-bottom-color: var(--gold-hi); }
  #tip[data-side='left'] i { border-left-color: var(--gold-hi); } #tip[data-side='right'] i { border-right-color: var(--gold-hi); }
  .tipLit { outline-color: var(--gold-hi); box-shadow: 0 0 18px var(--ember); }
  #version { font-family: var(--pixel); font-size: 7px; }

  /* falling leaves on the home screen (a few spans, placed by the CSS variables) */
  #leaves { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  #leaves span { position: absolute; top: -24px; left: var(--x); width: var(--s); height: var(--s); background: var(--c); border-radius: 0 70% 0 70%; opacity: 0.6;
    animation: leaf var(--t) linear var(--d) infinite; }
  @keyframes leaf { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(30px, 25vh) rotate(120deg); } 50% { transform: translate(-20px, 50vh) rotate(240deg); }
    75% { transform: translate(34px, 75vh) rotate(330deg); } 100% { transform: translate(-6px, 108vh) rotate(450deg); } }
  #home[hidden] #leaves { display: none; }
  @media (prefers-reduced-motion: reduce) { #leaves { display: none; } button.primary::after, .hmBattle::after { animation: none; } }

  /* gear grades (heroes have none): 1 Common grey, 2 Rare blue, 3 Epic purple, 4 Legendary gold, 5 Mythic crimson. --rc is the grade's colour, which the equipment views use. */
  :root { --r1: #9a9a9a; --r2: #4a9cff; --r3: #b06aff; --r4: #f0b44a; --r5: #ff3a4a; }
  .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); } .r5 { --rc: var(--r5); }
  .card, .hcard, .hrow, .ptSlot { min-width: 0; box-sizing: border-box; } .hrow > :not(canvas) { min-width: 0; }
  .rtag { font-style: normal; font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: #c8b890; }
  /* the recruit reveal: the cards flip over one after another; a new hero's card has a steady gold glow (nothing flashes or trembles) */
  .flip.new .face { box-shadow: 0 0 14px 2px rgba(255, 226, 122, 0.75); }
  .flip.new.up { z-index: 1; transform: scale(1.08); transition: transform 0.4s; }
/*__PIXEL_CSS__*/
