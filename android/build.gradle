// Top-level build file where you can add configuration options common to all sub-projects/modules.

// AAB-FIX (docs/notes/aab-fix.md): Maven Central answers GitHub's runners with 429 Too Many Requests at busy times, which failed a
// build. Google's public mirror of Maven Central (the same artifacts) is tried first, Maven Central itself after it.
ext.mavenCentralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

buildscript {
    
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // (the mirror first for every module, the plugins' own too: Capacitor's and RevenueCat's build files name mavenCentral() after it, for
    //  their build scripts and for their libraries)
    buildscript.repositories {
        maven { url rootProject.ext.mavenCentralMirror }
    }
    repositories {
        google()
        maven { url rootProject.ext.mavenCentralMirror }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
